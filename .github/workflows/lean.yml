name: Lean formalization

on:
  push:
    paths:
      - 'lean_proofs/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean_proofs/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/cache@v4
        with:
          path: lean_proofs/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean_proofs/lean-toolchain', 'lean_proofs/lakefile.toml', 'lean_proofs/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean_proofs/lean-toolchain', 'lean_proofs/lakefile.toml', 'lean_proofs/lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_proofs
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Build, enforce axiom allowlist, and check dependency pins
        run: python lean_proofs/scripts/check.py --fetch-cache
      - name: Validate Comparator and audit frozen statements
        if: runner.os == 'Linux'
        run: |
          python lean_proofs/scripts/test_comparator.py
          python lean_proofs/scripts/comparator.py
      - name: Check that verification preserved the pinned dependencies
        if: always()
        run: git diff --exit-code -- lean_proofs/lean-toolchain lean_proofs/lakefile.toml lean_proofs/lake-manifest.json
